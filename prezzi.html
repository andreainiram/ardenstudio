<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Prezzi & Abbonamenti — Arden Studio</title>
  <link rel="icon" href="assets/arden-monogram.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg-dark); }

    /* ── Page ── */
    .pricing-page {
      background: var(--bg-dark);
      color: var(--fg-on-dark);
      min-height: 100vh;
      padding-top: 64px; /* topbar height */
    }

    /* ── Hero header ── */
    .pricing-hero {
      text-align: center;
      padding: 72px 24px 56px;
      border-bottom: 1px solid rgba(193,163,128,0.15);
    }
    .pricing-hero .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.7;
      margin-bottom: 16px;
    }
    .pricing-hero h1 {
      font-family: var(--font-serif);
      font-size: clamp(42px, 7vw, 80px);
      font-weight: 300;
      line-height: 1.05;
      color: var(--fg-on-dark);
      margin: 0 0 20px;
    }
    .pricing-hero h1 em { font-style: italic; color: var(--accent); }
    .pricing-hero .hero-lede {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 300;
      color: var(--fg-on-dark);
      opacity: 0.65;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.8;
    }

    /* ── Category section ── */
    .pricing-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 32px 0;
    }
    .pricing-section-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(193,163,128,0.2);
    }
    .pricing-section-header .cat-num {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--accent);
      opacity: 0.6;
    }
    .pricing-section-header h2 {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 400;
      color: var(--fg-on-dark);
      margin: 0;
      letter-spacing: 0.02em;
    }
    .pricing-section-header .cat-sub {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 300;
      color: var(--accent);
      opacity: 0.6;
      margin-left: auto;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── Cards grid ── */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    /* ── Single card ── */
    .pricing-card {
      background: rgba(193,163,128,0.06);
      border: 1px solid rgba(193,163,128,0.14);
      border-radius: 2px;
      padding: 24px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .pricing-card:hover {
      border-color: rgba(193,163,128,0.35);
      background: rgba(193,163,128,0.10);
    }
    .pricing-card.featured {
      border-color: rgba(193,163,128,0.4);
      background: rgba(193,163,128,0.11);
    }
    .pricing-card .badge {
      position: absolute;
      top: -1px; right: 16px;
      background: var(--accent);
      color: var(--bg-dark);
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 3px 8px;
    }
    .pricing-card .card-name {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 400;
      color: var(--fg-on-dark);
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .pricing-card .card-sessions {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--accent);
      opacity: 0.65;
      margin-bottom: 16px;
    }
    .pricing-card .card-price {
      font-family: var(--font-serif);
      font-size: 40px;
      font-weight: 300;
      color: var(--fg-on-dark);
      line-height: 1;
    }
    .pricing-card .card-price .currency {
      font-size: 20px;
      vertical-align: super;
      margin-right: 2px;
      opacity: 0.7;
    }
    .pricing-card .card-per {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--accent);
      opacity: 0.5;
      margin-bottom: 20px;
    }

    /* ── MindBody button ── */
    .healcode-pricing-option-text-link,
    .card-btn {
      margin-top: auto;
      display: block;
      width: 100%;
      padding: 10px 0;
      background: transparent;
      border: 1px solid rgba(193,163,128,0.35);
      color: var(--accent) !important;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      cursor: pointer;
      text-decoration: none !important;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      box-sizing: border-box;
      touch-action: manipulation;
    }
    .healcode-pricing-option-text-link:hover,
    .card-btn:hover,
    .pricing-card.featured .healcode-pricing-option-text-link,
    .pricing-card.featured .card-btn {
      background: var(--accent) !important;
      color: var(--bg-dark) !important;
      border-color: var(--accent);
    }

    /* ── Footer note ── */
    .pricing-note {
      max-width: 1100px;
      margin: 48px auto 80px;
      padding: 0 32px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--accent);
      opacity: 0.45;
      text-align: center;
    }

    @media (max-width: 600px) {
      .pricing-section { padding: 48px 20px 0; }
      .pricing-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .pricing-card { padding: 18px 16px 16px; }
      .pricing-card .card-price { font-size: 26px; }
      .pricing-section-header .cat-sub { display: none; }
    }
    @media (max-width: 400px) {
      .pricing-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="pricing-root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="copy.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function MboLink({ serviceId, labelIt, labelEn, lang }) {
      const href = `https://cart.mindbodyonline.com/sites/134138/cart/add_service?mbo_item_id=${serviceId}`;
      return (
        <a href={href} target="_blank" rel="noopener noreferrer" className="card-btn" style={{display:'block',textAlign:'center'}}>
          {lang === 'it' ? labelIt : labelEn}
        </a>
      );
    }

    function PricingApp() {
      const [lang, setLang] = useState(() => localStorage.getItem("arden_lang") || "it");
      useEffect(() => { localStorage.setItem("arden_lang", lang); }, [lang]);

      const [menuOpen, setMenuOpen] = useState(false);
      useEffect(() => {
        if (!menuOpen) return;
        const onResize = () => { if (window.innerWidth > 880) setMenuOpen(false); };
        const onKey = (e) => { if (e.key === "Escape") setMenuOpen(false); };
        window.addEventListener("resize", onResize);
        window.addEventListener("keydown", onKey);
        document.body.style.overflow = "hidden";
        return () => {
          window.removeEventListener("resize", onResize);
          window.removeEventListener("keydown", onKey);
          document.body.style.overflow = "";
        };
      }, [menuOpen]);

      // Pricing page is always dark — topbar stays on-dark, fades on scroll
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 10);
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const t = window.COPY[lang];

      return (

            </a>

            <button
              type="button"
              className="menu-toggle"
              aria-label={menuOpen ? "Chiudi menu" : "Apri menu"}
              aria-expanded={menuOpen}

              <span className="menu-toggle-bar"></span>
              <span className="menu-toggle-bar"></span>

              <a href="index.html#method"  onClick={() => setMenuOpen(false)}>{t.nav.method}</a>
              <a href="index.html#booking" onClick={() => setMenuOpen(false)}>{t.nav.booking}</a>
              <a href="prezzi.html"        onClick={() => setMenuOpen(false)} style={{ opacity: 1 }}>{t.nav.pricing}</a>
              <a href="index.html#contact" onClick={() => setMenuOpen(false)}>{t.nav.contact}</a>

              <div className="lang-toggle">

            {/* 01 LAGREE */}

              <div className="pricing-grid">
                <div className="pricing-card">
                  <span className="card-name">Intro Offer</span>

                  <div className="card-price"><span className="currency">€</span>70</div>

                  <MboLink serviceId="100010" labelIt="Acquista" labelEn="Buy now" lang={lang} />

                  <span className="card-name">{lang === "it" ? "10 Lezioni" : "10 Classes"}</span>

          </div>

      );
    }

    const root = ReactDOM.createRoot(document.getElementById("pricing-root"));
    root.render(<PricingApp />);
